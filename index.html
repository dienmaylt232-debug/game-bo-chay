<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chú Bò Vượt Ngục - Pixel Art Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #051e11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #info { font-size: 20px; font-weight: bold; color: #fef08a; margin-bottom: 12px; }
        #game-board {
            position: relative;
            width: 360px;
            height: 550px;
            border: 4px solid #22c55e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas { 
            display: block; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .msg-box {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 30, 17, 0.92);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 15px; text-align: center; padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #4ade80; font-size: 24px; text-shadow: 2px 2px #052e16; }
        p { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        button {
            padding: 12px 28px; font-size: 16px; font-weight: bold;
            background-color: #22c55e; color: #052e16; border: none; border-radius: 8px; 
            cursor: pointer; box-shadow: 0 4px 0 #15803d; transition: all 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #15803d; }
    </style>
</head>
<body>

    <div id="info">Quãng đường: <span id="score">0</span>m</div>

    <div id="game-board">
        <canvas id="cvs" width="360" height="550"></canvas>

        <div id="start-screen" class="msg-box">
            <h1>BÒ VƯỢT NGỤC 🐮💥</h1>
            <p>Dùng <b>Phím Mũi Tên Trái / Phải</b> hoặc <b>Chạm Màn Hình</b> để né chướng ngại vật!</p>
            <button onclick="startGame()">BẮT ĐẦU CHẠY</button>
        </div>

        <div id="over-screen" class="msg-box hidden">
            <h1 style="color: #ef4444;">BẠN BỊ BẮT LẠI! 👨‍🌾</h1>
            <p>Quãng đường chạy được: <b id="final-score">0</b>m</p>
            <button onclick="restartGame()">CHẠY LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const overScreen = document.getElementById('over-screen');

        // --- KHỞI TẠO VẼ HÌNH PIXEL BẰNG CODE (FALLBACK CHUẨN ĐẸP) ---
        function createPixelCanvas(drawFunc, w, h) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const cx = c.getContext('2d');
            cx.imageSmoothingEnabled = false;
            drawFunc(cx, w, h);
            return c;
        }

        // Vẽ con bò Pixel
        const imgCow = createPixelCanvas((c) => {
            c.fillStyle = '#ffffff'; c.fillRect(8, 10, 32, 28);
            c.fillStyle = '#1e293b'; c.fillRect(12, 14, 10, 10); c.fillRect(26, 24, 12, 8);
            c.fillStyle = '#f43f5e'; c.fillRect(18, 32, 12, 6);
            c.fillStyle = '#334155'; c.fillRect(6, 6, 6, 6); c.fillRect(36, 6, 6, 6);
        }, 48, 48);

        // Vẽ bác nông dân Pixel
        const imgFarmer = createPixelCanvas((c) => {
            c.fillStyle = '#eab308'; c.fillRect(10, 4, 28, 8); // Mũ rơm
            c.fillStyle = '#fca5a5'; c.fillRect(14, 12, 20, 12); // Mặt
            c.fillStyle = '#2563eb'; c.fillRect(12, 24, 24, 18); // Áo
        }, 48, 48);

        // Vẽ thùng gỗ Pixel
        const imgObstacle = createPixelCanvas((c) => {
            c.fillStyle = '#854d0e'; c.fillRect(6, 6, 36, 36);
            c.fillStyle = '#a16207'; c.fillRect(10, 10, 28, 28);
            c.fillStyle = '#713f12'; c.fillRect(6, 22, 36, 4);
        }, 48, 48);

        // --- NHẠC NỀN & ÂM THANH 8-BIT ---
        let audioCtx = null;
        let bgmInterval = null;
        const melody = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 293.66];
        let noteIdx = 0;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            noteIdx = 0;
            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = melody[noteIdx % melody.length];
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                noteIdx++;
            }, 160);
        }

        function stopBGM() { if (bgmInterval) clearInterval(bgmInterval); }

        // --- GAME LOGIC ---
        let isPlaying = false;
        let score = 0;
        let speed = 5;
        let timer = 0;
        const lanes = [60, 180, 300];
        let currentLane = 1;

        const cow = { x: lanes[1], y: 420, targetX: lanes[1], w: 48, h: 48 };
        const farmer = { x: lanes[1], y: 490, w: 44, h: 44 };
        let obstacles = [];

        function createObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            obstacles.push({ x: lanes[laneIdx], y: -50, w: 44, h: 44 });
        }

        function moveLeft() {
            if (currentLane > 0 && isPlaying) {
                currentLane--;
                cow.targetX = lanes[currentLane];
            }
        }

        function moveRight() {
            if (currentLane < 2 && isPlaying) {
                currentLane++;
                cow.targetX = lanes[currentLane];
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            if (touchX < canvas.width / 2) moveLeft();
            else moveRight();
        });

        function startGame() {
            initAudio();
            isPlaying = true;
            startScreen.classList.add('hidden');
            startBGM();
            loop();
        }

        function update() {
            if (!isPlaying) return;

            cow.x += (cow.targetX - cow.x) * 0.25;
            farmer.x += (cow.x - farmer.x) * 0.08;

            timer++;
            if (timer % 45 === 0) createObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += speed;

                if (Math.abs(cow.x - obs.x) < 32 && Math.abs(cow.y - obs.y) < 28) {
                    gameOver();
                }

                if (obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    if (score % 100 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            // Nền cỏ
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Đường làn
            ctx.strokeStyle = '#4ade80';
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -timer * speed;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
            ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
            ctx.stroke();

            // Vẽ Nông Dân
            ctx.drawImage(imgFarmer, farmer.x - farmer.w/2, farmer.y - farmer.h/2, farmer.w, farmer.h);

            // Vẽ Bò
            ctx.drawImage(imgCow, cow.x - cow.w/2, cow.y - cow.h/2, cow.w, cow.h);

            // Vẽ Chướng Ngại Vật
            for (let obs of obstacles) {
                ctx.drawImage(imgObstacle, obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h);
            }
        }

        function loop() {
            update();
            draw();
            if (isPlaying) requestAnimationFrame(loop);
        }

        function gameOver() {
            stopBGM();
            isPlaying = false;
            finalScoreEl.innerText = score;
            overScreen.classList.remove('hidden');
        }

        function restartGame() {
            isPlaying = true;
            score = 0; speed = 5; timer = 0; obstacles = [];
            currentLane = 1; cow.x = lanes[1]; cow.targetX = lanes[1];
            scoreEl.innerText = '0';
            overScreen.classList.add('hidden');
            startBGM();
            loop();
        }
    </script>
</body>
</html>
