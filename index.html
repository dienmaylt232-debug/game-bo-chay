<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chú Bò Vượt Ngục - Nữ Vương Đại Chiến FF Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #051e11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        #info { font-size: 20px; font-weight: bold; color: #fef08a; margin-bottom: 12px; }
        #game-board {
            position: relative; width: 360px; height: 550px;
            border: 4px solid #ef4444; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas { 
            display: block; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .msg-box {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 5, 10, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 15px; text-align: center; padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #f87171; font-size: 24px; text-shadow: 2px 2px #450a0a; }
        p { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        button {
            padding: 12px 28px; font-size: 16px; font-weight: bold;
            background-color: #ef4444; color: #fff; border: none; border-radius: 8px; 
            cursor: pointer; box-shadow: 0 4px 0 #991b1b; transition: all 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #991b1b; }
    </style>
</head>
<body>

    <div id="info">Quãng đường: <span id="score">0</span>m</div>

    <div id="game-board">
        <canvas id="cvs" width="360" height="550"></canvas>

        <div id="start-screen" class="msg-box">
            <h1>BÒ VƯỢT NGỤC<br>🔥 NỮ VƯƠNG ĐẠI CHIẾN 🔥</h1>
            <p>Dùng <b>Phím Trái / Phải</b> hoặc <b>Chạm Màn Hình</b> để né chướng ngại vật!<br><i style="color: #fef08a;">🔊 Nhạc nền Rap Battle cực căng!</i></p>
            <button onclick="startGame()">BẮT ĐẦU CHIẾN</button>
        </div>

        <div id="over-screen" class="msg-box hidden">
            <h1 style="color: #ef4444;">BẠN BỊ BẮT LẠI! 👨‍🌾</h1>
            <p>Quãng đường chạy được: <b id="final-score">0</b>m</p>
            <button onclick="restartGame()">CHIẾN LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const overScreen = document.getElementById('over-screen');

        // --- TẢI HÌNH ẢNH PIXEL ---
        const imgCow = new Image();
        imgCow.src = 'watermarked_img_9337427793953355696.png'; //[cite: 1]

        const imgFarmer = new Image();
        imgFarmer.src = 'watermarked_img_1535765349547511823.png'; //[cite: 2]

        const imgObstacle = new Image();
        imgObstacle.src = 'watermarked_img_8953806816663576093.png'; //[cite: 3]

        // --- HỆ THỐNG ÂM THANH RAP BATTLE CỰC CĂNG ---
        let audioCtx = null;
        let bgmInterval = null;
        
        // Mô phỏng nhịp điệu bass dồn dập, phong cách nhạc nền sự kiện game
        const rapBeatBass = [110, 110, 146.83, 164.81, 110, 110, 196.00, 174.61];
        const rapBeatLead = [220, 330, 440, 523.25, 493.88, 440, 330, 293.66];
        let beatStep = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(freq, type, duration, vol = 0.05) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; // 'sawtooth' hoặc 'square' tạo chất âm điện tử mạnh mẽ
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            beatStep = 0;
            bgmInterval = setInterval(() => {
                if (!isPlaying) return;
                // Tạo nhịp trống bass và giai điệu dồn dập như nhạc rap chiến đấu
                playSound(rapBeatBass[beatStep % rapBeatBass.length], 'sawtooth', 0.1, 0.06);
                if (beatStep % 2 === 0) {
                    playSound(rapBeatLead[(beatStep / 2) % rapBeatLead.length], 'square', 0.08, 0.03);
                }
                beatStep++;
            }, 115); // Tốc độ nhanh, dồn dập
        }

        function stopBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
        }

        function playCrashSound() {
            playSound(80, 'sawtooth', 0.4, 0.15);
            setTimeout(() => playSound(40, 'sawtooth', 0.5, 0.2), 100);
        }

        // --- GAME LOGIC ---
        let isPlaying = false;
        let score = 0;
        let speed = 5.5;
        let timer = 0;
        const lanes = [60, 180, 300];
        let currentLane = 1;

        const cow = { x: lanes[1], y: 400, targetX: lanes[1], w: 60, h: 60 };
        const farmer = { x: lanes[1], y: 480, w: 55, h: 55 };
        let obstacles = [];

        function createObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            obstacles.push({ x: lanes[laneIdx], y: -60, w: 50, h: 50 });
        }

        function moveLeft() {
            if (currentLane > 0 && isPlaying) {
                currentLane--;
                cow.targetX = lanes[currentLane];
                playSound(350, 'triangle', 0.05, 0.04);
            }
        }

        function moveRight() {
            if (currentLane < 2 && isPlaying) {
                currentLane++;
                cow.targetX = lanes[currentLane];
                playSound(450, 'triangle', 0.05, 0.04);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            if (touchX < canvas.width / 2) moveLeft();
            else moveRight();
        });

        function startGame() {
            initAudio();
            isPlaying = true;
            startScreen.classList.add('hidden');
            startBGM();
            loop();
        }

        function update() {
            if (!isPlaying) return;

            cow.x += (cow.targetX - cow.x) * 0.25;
            farmer.x += (cow.x - farmer.x) * 0.08;

            timer++;
            if (timer % 40 === 0) createObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += speed;

                if (Math.abs(cow.x - obs.x) < 35 && Math.abs(cow.y - obs.y) < 35) {
                    gameOver();
                }

                if (obs.y > canvas.height + 60) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    if (score % 100 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#f87171';
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -timer * speed;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
            ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
            ctx.stroke();

            if (imgFarmer.complete) {
                ctx.drawImage(imgFarmer, farmer.x - farmer.w/2, farmer.y - farmer.h/2, farmer.w, farmer.h);
            }

            if (imgCow.complete) {
                ctx.drawImage(imgCow, 0, 0, imgCow.width/3, imgCow.height/4, cow.x - cow.w/2, cow.y - cow.h/2, cow.w, cow.h);
            }

            for (let obs of obstacles) {
                if (imgObstacle.complete) {
                    ctx.drawImage(imgObstacle, 0, 0, imgObstacle.width/2, imgObstacle.height/2, obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h);
                }
            }
        }

        function loop() {
            update();
            draw();
            if (isPlaying) requestAnimationFrame(loop);
        }

        function gameOver() {
            stopBGM();
            playCrashSound();
            isPlaying = false;
            finalScoreEl.innerText = score;
            overScreen.classList.remove('hidden');
        }

        function restartGame() {
            isPlaying = true;
            score = 0; speed = 5.5; timer = 0; obstacles = [];
            currentLane = 1; cow.x = lanes[1]; cow.targetX = lanes[1];
            scoreEl.innerText = '0';
            overScreen.classList.add('hidden');
            startBGM();
            loop();
        }
    </script>
</body>
</html>
