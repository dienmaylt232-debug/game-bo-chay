<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chú Bò Vượt Ngục - Full 3D Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #051e11;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        #info { font-size: 20px; font-weight: bold; color: #fef08a; margin-bottom: 12px; }
        #game-board {
            position: relative; width: 360px; height: 550px;
            border: 4px solid #22c55e; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        canvas { 
            display: block; 
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .msg-box {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 30, 17, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            gap: 15px; text-align: center; padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #4ade80; font-size: 24px; text-shadow: 2px 2px #052e16; }
        p { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        button {
            padding: 12px 28px; font-size: 16px; font-weight: bold;
            background-color: #22c55e; color: #052e16; border: none; border-radius: 8px; 
            cursor: pointer; box-shadow: 0 4px 0 #15803d; transition: all 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px 0 #15803d; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- THAY TÊN FILE NHẠC CỦA BẠN VÀO ĐÂY (VD: jack.mp3) -->
    <!-- ========================================== -->
    <audio id="bgMusic" loop>
        <source src="TEN_FILE_NHAC_CUA_BAN.mp3" type="audio/mpeg">
    </audio>

    <div id="info">Quãng đường: <span id="score">0</span>m</div>

    <div id="game-board">
        <canvas id="cvs" width="360" height="550"></canvas>

        <div id="start-screen" class="msg-box">
            <h1>BÒ VƯỢT NGỤC 🐮💥</h1>
            <p>Dùng <b>Phím Trái / Phải</b> hoặc <b>Chạm Màn Hình</b> để né chướng ngại vật!</p>
            <button onclick="startGame()">BẮT ĐẦU CHẠY</button>
        </div>

        <div id="over-screen" class="msg-box hidden">
            <h1 style="color: #ef4444;">BẠN BỊ BẮT LẠI! 👨‍🌾</h1>
            <p>Quãng đường chạy được: <b id="final-score">0</b>m</p>
            <button onclick="restartGame()">CHẠY LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const overScreen = document.getElementById('over-screen');
        const bgMusic = document.getElementById('bgMusic');

        // --- TẢI HÌNH ẢNH CHÚ BÒ VÀ NÔNG DÂN ---
        let cowLoaded = false;
        const imgCow = new Image();
        imgCow.onload = () => { cowLoaded = true; };
        imgCow.src = 'cow.jpg'; // File ảnh chú bò 3D của bạn

        let farmerLoaded = false;
        const imgFarmer = new Image();
        imgFarmer.onload = () => { farmerLoaded = true; };
        imgFarmer.src = 'farmer.png'; // File ảnh chú nông dân của bạn

        let obstacleLoaded = false;
        const imgObstacle = new Image();
        imgObstacle.onload = () => { obstacleLoaded = true; };
        imgObstacle.src = 'watermarked_img_8953806816663576093.png';

        // --- GAME LOGIC ---
        let isPlaying = false;
        let score = 0;
        let speed = 5;
        let timer = 0;
        const lanes = [60, 180, 300];
        let currentLane = 1;

        const cow = { x: lanes[1], y: 400, targetX: lanes[1], w: 65, h: 65 };
        const farmer = { x: lanes[1], y: 480, w: 60, h: 60 };
        let obstacles = [];

        function createObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            obstacles.push({ x: lanes[laneIdx], y: -60, w: 50, h: 50 });
        }

        function moveLeft() {
            if (currentLane > 0 && isPlaying) {
                currentLane--;
                cow.targetX = lanes[currentLane];
            }
        }

        function moveRight() {
            if (currentLane < 2 && isPlaying) {
                currentLane++;
                cow.targetX = lanes[currentLane];
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            if (touchX < canvas.width / 2) moveLeft();
            else moveRight();
        });

        function startGame() {
            isPlaying = true;
            startScreen.classList.add('hidden');
            
            // Kích hoạt nhạc
            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => console.log("Trình duyệt chặn phát tự động"));
            
            loop();
        }

        function update() {
            if (!isPlaying) return;

            cow.x += (cow.targetX - cow.x) * 0.25;
            farmer.x += (cow.x - farmer.x) * 0.08; // Nông dân đuổi theo bò

            timer++;
            if (timer % 45 === 0) createObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += speed;

                if (Math.abs(cow.x - obs.x) < 35 && Math.abs(cow.y - obs.y) < 35) {
                    gameOver();
                }

                if (obs.y > canvas.height + 60) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    if (score % 100 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            // Nền đường cỏ
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Vạch kẻ đường
            ctx.strokeStyle = '#4ade80';
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -timer * speed;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
            ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
            ctx.stroke();

            // Vẽ Chú Nông Dân Đuổi Theo
            if (farmerLoaded) {
                ctx.drawImage(imgFarmer, farmer.x - farmer.w/2, farmer.y - farmer.h/2, farmer.w, farmer.h);
            } else {
                ctx.fillStyle = '#f87171';
                ctx.fillRect(farmer.x - 20, farmer.y - 20, 40, 40);
            }

            // Vẽ Chú Bò 3D
            if (cowLoaded) {
                ctx.drawImage(imgCow, cow.x - cow.w/2, cow.y - cow.h/2, cow.w, cow.h);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(cow.x, cow.y, 25, 0, Math.PI * 2);
                ctx.fill();
            }

            // Vẽ Chướng Ngại Vật
            for (let obs of obstacles) {
                if (obstacleLoaded) {
                    ctx.drawImage(imgObstacle, 0, 0, imgObstacle.width/2, imgObstacle.height/2, obs.x - obs.w/2, obs.y - obs.h/2, obs.w, obs.h);
                } else {
                    ctx.fillStyle = '#eab308';
                    ctx.fillRect(obs.x - 20, obs.y - 20, 40, 40);
                }
            }
        }

        function loop() {
            update();
            draw();
            if (isPlaying) requestAnimationFrame(loop);
        }

        function gameOver() {
            bgMusic.pause();
            isPlaying = false;
            finalScoreEl.innerText = score;
            overScreen.classList.remove('hidden');
        }

        function restartGame() {
            isPlaying = true;
            score = 0; speed = 5; timer = 0; obstacles = [];
            currentLane = 1; cow.x = lanes[1]; cow.targetX = lanes[1];
            scoreEl.innerText = '0';
            overScreen.classList.add('hidden');
            
            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => {});
            
            loop();
        }
    </script>
</body>
</html>
