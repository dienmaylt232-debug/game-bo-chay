<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chú Bò Vượt Ngục</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #051e11;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #info {
            font-size: 18px;
            font-weight: bold;
            color: #fef08a;
            margin-bottom: 10px;
        }
        #game-board {
            position: relative;
            width: 360px;
            height: 550px;
            border: 4px solid #22c55e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }
        canvas { background-color: #166534; display: block; }
        .msg-box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 30, 17, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #4ade80; font-size: 22px; }
        p { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #22c55e;
            color: #052e16;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="info">Quãng đường: <span id="score">0</span>m</div>

    <div id="game-board">
        <canvas id="cvs" width="360" height="550"></canvas>

        <div id="start-screen" class="msg-box">
            <h1>BÒ VƯỢT NGỤC 🐮</h1>
            <p>Dùng <b>Phím Mũi Tên Trái / Phải</b> hoặc <b>Chạm bên Trái / Phải</b> màn hình để né chướng ngại vật.</p>
            <button onclick="startGame()">BẮT ĐẦU CHẠY</button>
        </div>

        <div id="over-screen" class="msg-box hidden">
            <h1 style="color: #ef4444;">BẠN BỊ BẮT LẠI! 👨‍🌾</h1>
            <p>Quãng đường: <b id="final-score">0</b>m</p>
            <button onclick="restartGame()">CHẠY LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const overScreen = document.getElementById('over-screen');

        let isPlaying = false;
        let score = 0;
        let speed = 5;
        let timer = 0;

        const lanes = [60, 180, 300];
        let currentLane = 1;

        const cow = { x: lanes[1], y: 430, targetX: lanes[1] };
        const farmer = { x: lanes[1], y: 500 };
        let obstacles = [];

        function createObstacle() {
            const laneIdx = Math.floor(Math.random() * 3);
            obstacles.push({ x: lanes[laneIdx], y: -40, w: 50, h: 30 });
        }

        function moveLeft() {
            if (currentLane > 0 && isPlaying) {
                currentLane--;
                cow.targetX = lanes[currentLane];
            }
        }

        function moveRight() {
            if (currentLane < 2 && isPlaying) {
                currentLane++;
                cow.targetX = lanes[currentLane];
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft();
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            if (touchX < canvas.width / 2) moveLeft();
            else moveRight();
        });

        function startGame() {
            isPlaying = true;
            startScreen.classList.add('hidden');
            loop();
        }

        function update() {
            if (!isPlaying) return;

            cow.x += (cow.targetX - cow.x) * 0.2;
            farmer.x += (cow.x - farmer.x) * 0.08;

            timer++;
            if (timer % 55 === 0) createObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += speed;

                if (Math.abs(cow.x - obs.x) < 35 && Math.abs(cow.y - obs.y) < 30) {
                    gameOver();
                }

                if (obs.y > canvas.height + 40) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreEl.innerText = score;
                    if (score % 100 === 0) speed += 0.5;
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#166534';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#22c55e';
            ctx.setLineDash([15, 15]);
            ctx.lineDashOffset = -timer * speed;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(120, 0); ctx.lineTo(120, canvas.height);
            ctx.moveTo(240, 0); ctx.lineTo(240, canvas.height);
            ctx.stroke();

            // Nông dân
            ctx.fillStyle = '#f97316';
            ctx.beginPath(); ctx.arc(farmer.x, farmer.y, 14, 0, Math.PI * 2); ctx.fill();

            // Bò
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cow.x - 18, cow.y - 20, 36, 40);
            ctx.fillStyle = '#000000';
            ctx.fillRect(cow.x - 8, cow.y - 10, 8, 8);
            ctx.fillRect(cow.x + 2, cow.y + 5, 8, 8);

            // Chướng ngại vật
            ctx.fillStyle = '#ef4444';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x - obs.w / 2, obs.y - obs.h / 2, obs.w, obs.h);
            }
        }

        function loop() {
            update();
            draw();
            if (isPlaying) requestAnimationFrame(loop);
        }

        function gameOver() {
            isPlaying = false;
            finalScoreEl.innerText = score;
            overScreen.classList.remove('hidden');
        }

        function restartGame() {
            isPlaying = true;
            score = 0;
            speed = 5;
            timer = 0;
            obstacles = [];
            currentLane = 1;
            cow.x = lanes[1];
            cow.targetX = lanes[1];
            scoreEl.innerText = '0';
            overScreen.classList.add('hidden');
            loop();
        }
    </script>
</body>
</html>
